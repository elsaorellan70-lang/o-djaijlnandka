<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> pamela okok</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        
        .header {
            text-align: center;
            padding: 10px;
            width: 100%;
        }
        
        h1 {
            color: #00d9ff;
            font-size: 28px;
            text-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
            margin-bottom: 5px;
        }
        
        .score-board {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 400px;
            margin: 10px 0;
        }
        
        .score-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .score-label {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
        }
        
        .score-value {
            font-size: 24px;
            font-weight: bold;
            color: #00d9ff;
        }
        
        .game-container {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        
        canvas {
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
            border: 3px solid #00d9ff;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.3);
            max-width: 90vw;
            max-height: 50vh;
        }
        
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .control-btn {
            background: rgba(0, 217, 255, 0.2);
            border: 2px solid #00d9ff;
            border-radius: 15px;
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            -webkit-user-select: none;
        }
        
        .control-btn:active {
            background: rgba(0, 217, 255, 0.5);
            transform: scale(0.95);
        }
        
        .control-btn.empty {
            visibility: hidden;
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            border: 3px solid #ff4757;
            display: none;
            z-index: 10;
        }
        
        .game-over h2 {
            color: #ff4757;
            font-size: 32px;
            margin-bottom: 15px;
        }
        
        .game-over button {
            background: #00d9ff;
            color: #1a1a2e;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        
        .game-over button:active {
            transform: scale(0.95);
        }
        
        @media (max-width: 480px) {
            h1 { font-size: 24px; }
            .controls {
                grid-template-columns: repeat(3, 50px);
                grid-template-rows: repeat(3, 50px);
            }
            .control-btn { font-size: 20px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>gusanito okok</h1>
    </div>
    
    <div class="score-board">
        <div class="score-item">
            <div class="score-label">no se q poner</div>
            <div class="score-value" id="score">0</div>
        </div>
        <div class="score-item">
            <div class="score-label">si</div>
            <div class="score-value" id="highScore">0</div>
        </div>
    </div>

    <div class="game-container">
        <canvas id="game"></canvas>
        <div class="game-over" id="gameOver">
            <h2>a daniel le mide</h2>
            <p>solo  <span id="finalScore">0</span></p>
            <button onclick="restartGame()"> ok</button>
        </div>
    </div>

    <div class="controls">
        <div class="control-btn empty"></div>
        <div class="control-btn" data-dir="UP">⬆️</div>
        <div class="control-btn empty"></div>
        <div class="control-btn" data-dir="LEFT">⬅️</div>
        <div class="control-btn empty"></div>
        <div class="control-btn" data-dir="RIGHT">➡️</div>
        <div class="control-btn empty"></div>
        <div class="control-btn" data-dir="DOWN">⬇️</div>
        <div class="control-btn empty"></div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        
        // Ajustar tamaño del canvas al dispositivo
        const size = Math.min(window.innerWidth * 0.9, window.innerHeight * 0.5, 400);
        canvas.width = size;
        canvas.height = size;
        
        const gridSize = 20;
        const tileCount = Math.floor(size / gridSize);
        
        let snake = [{x: Math.floor(tileCount / 2), y: Math.floor(tileCount / 2)}];
        let dir = 'RIGHT';
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameSpeed = 150;
        let gameLoop;
        let isGameOver = false;
        
        document.getElementById('highScore').innerText = highScore;
        
        let food = generateFood();

        function generateFood() {
            let newFood;
            do {
                newFood = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } while (snake.some(segment => segment.x === newFood.x && segment.y === newFood.y));
            return newFood;
        }

        // Controles táctiles
        document.querySelectorAll('.control-btn[data-dir]').forEach(btn => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                changeDirection(btn.dataset.dir);
            });
            btn.addEventListener('click', () => {
                changeDirection(btn.dataset.dir);
            });
        });

        // Controles de teclado (para PC)
        document.addEventListener('keydown', e => {
            if(e.key === 'ArrowLeft') changeDirection('LEFT');
            else if(e.key === 'ArrowUp') changeDirection('UP');
            else if(e.key === 'ArrowRight') changeDirection('RIGHT');
            else if(e.key === 'ArrowDown') changeDirection('DOWN');
        });

        function changeDirection(newDir) {
            if (isGameOver) return;
            const opposites = {UP: 'DOWN', DOWN: 'UP', LEFT: 'RIGHT', RIGHT: 'LEFT'};
            if (newDir !== opposites[dir]) {
                dir = newDir;
            }
        }

        function draw() {
            if (isGameOver) return;

            // Fondo con gradiente
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#0f3460');
            gradient.addColorStop(1, '#16213e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);

            // Dibujar cuadrícula sutil
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, size);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(size, i * gridSize);
                ctx.stroke();
            }

            // Dibujar comida con efecto brillante
            ctx.fillStyle = '#ff4757';
            ctx.shadowColor = '#ff4757';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0;

            // Dibujar serpiente
            snake.forEach((segment, index) => {
                const isHead = index === 0;
                
                if (isHead) {
                    ctx.fillStyle = '#00d9ff';
                    ctx.shadowColor = '#00d9ff';
                    ctx.shadowBlur = 10;
                } else {
                    const alpha = 1 - (index / snake.length) * 0.5;
                    ctx.fillStyle = `rgba(0, 217, 255, ${alpha})`;
                    ctx.shadowBlur = 0;
                }
                
                ctx.fillRect(
                    segment.x * gridSize + 1,
                    segment.y * gridSize + 1,
                    gridSize - 2,
                    gridSize - 2
                );
                
                if (isHead) {
                    // Ojos de la serpiente
                    ctx.fillStyle = '#1a1a2e';
                    const eyeSize = 3;
                    const eyeOffset = 5;
                    ctx.fillRect(
                        segment.x * gridSize + eyeOffset,
                        segment.y * gridSize + eyeOffset,
                        eyeSize,
                        eyeSize
                    );
                    ctx.fillRect(
                        segment.x * gridSize + gridSize - eyeOffset - eyeSize,
                        segment.y * gridSize + eyeOffset,
                        eyeSize,
                        eyeSize
                    );
                }
            });

            // Mover serpiente
            let headX = snake[0].x;
            let headY = snake[0].y;

            if (dir === 'LEFT') headX--;
            if (dir === 'UP') headY--;
            if (dir === 'RIGHT') headX++;
            if (dir === 'DOWN') headY++;

            // Comer comida
            if (headX === food.x && headY === food.y) {
                score++;
                document.getElementById('score').innerText = score;
                food = generateFood();
                
                // Aumentar velocidad cada 5 puntos
                if (score % 5 === 0 && gameSpeed > 80) {
                    gameSpeed -= 10;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(draw, gameSpeed);
                }
            } else {
                snake.pop();
            }

            let newHead = {x: headX, y: headY};

            // Colisiones
            if (headX < 0 || headY < 0 || headX >= tileCount || headY >= tileCount || 
                snake.some(segment => segment.x === headX && segment.y === headY)) {
                endGame();
                return;
            }

            snake.unshift(newHead);
        }

        function endGame() {
            isGameOver = true;
            clearInterval(gameLoop);
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                document.getElementById('highScore').innerText = highScore;
            }
            
            document.getElementById('finalScore').innerText = score;
            document.getElementById('gameOver').style.display = 'block';
        }

        function restartGame() {
            snake = [{x: Math.floor(tileCount / 2), y: Math.floor(tileCount / 2)}];
            dir = 'RIGHT';
            score = 0;
            gameSpeed = 150;
            isGameOver = false;
            document.getElementById('score').innerText = score;
            document.getElementById('gameOver').style.display = 'none';
            food = generateFood();
            clearInterval(gameLoop);
            gameLoop = setInterval(draw, gameSpeed);
        }

        // Iniciar juego
        gameLoop = setInterval(draw, gameSpeed);
        
        // Prevenir scroll en móvil
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
